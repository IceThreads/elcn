<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开发中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #f8fafc;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-text {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 700;
            color: #1e293b;
            letter-spacing: 0.04em;
            cursor: default;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: none;
            animation: none;
        }

        .main-text:hover,
        .main-text:active,
        .main-text:focus,
        .main-text:focus-visible {
            color: #1e293b;
            background: transparent;
            outline: none;
            box-shadow: none;
            transform: none;
            scale: 1;
            text-shadow: none;
        }

        .hint {
            position: fixed;
            bottom: 2rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 0.06em;
            user-select: none;
            pointer-events: none;
            opacity: 0.5;
        }

        .no-transition {
            transition: none !important;
            animation: none !important;
        }
    </style>
</head>
<body>

    <div id="clickTarget" class="main-text">开发中，敬请期待</div>


    <script>
        (function() {
            let clickCount = 0;
            const TARGET_URL = '/elcn/about.html';
            const el = document.getElementById('clickTarget');

            function handleClick(e) {

                clickCount += 1;


                if (clickCount >= 5) {

                    window.location.href = TARGET_URL;
                }
            }


            el.addEventListener('click', handleClick, false);

            el.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            }, false);


        })();
    </script>

</body>
</html>
