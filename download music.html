<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>下载中心</title>
    <style>
        /* ===== CSS 变量（跟随系统） ===== */
        :root {
            --bg-primary: #f5f7fa;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f2f5;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888aa;
            --border-color: #e2e4ea;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.14);
            --accent: #5b6bf0;
            --accent-hover: #4a5ad6;
            --accent-light: rgba(91, 107, 240, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 深色模式 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f0f1a;
                --bg-card: #1a1a2e;
                --bg-card-hover: #252540;
                --text-primary: #eaeaf0;
                --text-secondary: #b8b8d0;
                --text-muted: #6a6a8a;
                --border-color: #2a2a44;
                --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.7);
                --accent: #7b8aff;
                --accent-hover: #6a7aee;
                --accent-light: rgba(123, 138, 255, 0.18);
            }
        }

        /* ===== 全局重置 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px;
            transition: background var(--transition), color var(--transition);
        }

        /* ===== 主容器 ===== */
        #app {
            width: 100%;
            max-width: 780px;
            animation: fadeUp 0.5s ease;
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
            -webkit-text-fill-color: var(--text-muted);
        }

        /* ===== 下载列表 ===== */
        .download-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            color: inherit;
            gap: 16px;
        }

        .download-item:hover {
            background: var(--bg-card-hover);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .download-item:active {
            transform: scale(0.98);
        }

        .download-item .item-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition);
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }

        .download-item .item-download {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
            white-space: nowrap;
            flex-shrink: 0;
            transition: all var(--transition);
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--accent-light);
        }

        .download-item:hover .item-download {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(91, 107, 240, 0.35);
        }

        .download-item .item-download .arrow {
            display: inline-block;
            transition: transform var(--transition);
            font-size: 16px;
        }

        .download-item:hover .item-download .arrow {
            transform: translateX(4px);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* ===== 动画 ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .download-item {
                padding: 14px 18px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .download-item .item-name {
                font-size: 17px;
                flex: 1 1 100%;
            }

            .download-item .item-download {
                font-size: 13px;
                padding: 4px 12px;
                margin-left: auto;
            }

            .header h1 {
                font-size: 24px;
            }
        }

        @media (max-width: 400px) {
            .download-item .item-name {
                font-size: 15px;
            }

            .download-item .item-download {
                font-size: 12px;
                padding: 2px 10px;
            }
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1> 下载中心</h1>
            <p></p>
        </div>

        <div class="download-list" id="downloadList">
            <!-- 由 JavaScript 动态渲染 -->
        </div>
    </div>

    <script>
        (function() {
            'use strict';


            const downloads = [
                { id: 1, name: '视频入口', url: '/elcn/404' },
                { id: 2, name: '音频入口', url: 'https://github.com/IceThreads/photo/releases/tag/%E9%9F%B3%E9%A2%91' },
                { id: 2, name: '小说入口【密码：xs】', url: 'https://wwbui.lanzouv.com/b00rp7g6ra' },
            ];

            const listContainer = document.getElementById('downloadList');

            function renderDownloads() {
                if (!downloads || downloads.length === 0) {
                    listContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>暂无下载资源</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const item of downloads) {
                    // 安全转义（防止 XSS）
                    const safeUrl = item.url.replace(/"/g, '&quot;');
                    const safeName = item.name.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    html += `
                        <a class="download-item" href="${safeUrl}" target="_blank" rel="noopener noreferrer" title="点击下载 ${safeName}">
                            <span class="item-name">${safeName}</span>
                            <span class="item-download">
                                点击下载
                                <span class="arrow">→</span>
                            </span>
                        </a>
                    `;
                }
                listContainer.innerHTML = html;
            }

            // 页面加载后渲染
            renderDownloads();
        })();
    </script>
</body>
</html>
